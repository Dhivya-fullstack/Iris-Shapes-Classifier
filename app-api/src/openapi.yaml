openapi: "3.0.0"
info:
  description: API Endpoints for serving Machine Learning Models
  version: 1.0.0
  title: API Endpoints for serving Machine Learning Models
servers:
  - url: http://localhost:8002/api
paths:
  /models/irisClassifier:
    put:
      operationId: models.irisClassifier
      summary: Predict Iris flower class using trained model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sepal_length:
                  type: number
                sepal_width:
                  type: number
                petal_length:
                  type: number
                petal_width:
                  type: number
              required:
                - sepal_length
                - sepal_width
                - petal_length
                - petal_width
      responses:
        "200":
          description: Successful prediction
          content:
            application/json:
              schema:
                type: object
                properties:
                  prediction:
                    type: integer
        "500":
          description: Internal Server Error

  /models/shapesClassifier:
    put:
      operationId: models.shapesClassifier
      summary: Classify shapes using CNN model
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Successful prediction
          content:
            application/json:
              schema:
                type: object
                properties:
                  prediction:
                    type: integer
        "500":
          description: Internal Server Error