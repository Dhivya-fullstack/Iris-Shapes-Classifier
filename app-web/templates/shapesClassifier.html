<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shapes Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eff668, #a24b67);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            font-size: 14px;
        }

        .upload-box {
            margin: 20px 0;
        }

        input[type="file"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-btn {
            background-color: #4CAF50;
            color: white;
        }

        .reset-btn {
            background-color: #f44336;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Shapes Classifier</h1>
        <p>Upload an image to classify shapes using a deep learning model.</p>

        <form action="/shapesClassifier" method="post" enctype="multipart/form-data">
            
            <div class="upload-box">
                <input type="file" name="image" accept="image/*" required>
            </div>

            <div class="buttons">
                <button type="reset" class="reset-btn">Clear</button>
                <button type="submit" class="submit-btn">Predict</button>
            </div>

        </form>
    </div>

</body>
</html>
