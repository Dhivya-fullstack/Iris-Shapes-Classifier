<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iris Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background:linear-gradient(to right,rgb(243, 129, 129),rgb(186, 246, 117));
            text-align: center;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            color: green;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Iris Flower Classifier</h1>

    <form method="POST">
        <input type="number" step="any" name="sepal_length" placeholder="Sepal Length" required>
        <input type="number" step="any" name="sepal_width" placeholder="Sepal Width" required>
        <input type="number" step="any" name="petal_length" placeholder="Petal Length" required>
        <input type="number" step="any" name="petal_width" placeholder="Petal Width" required>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <div class="result">
            Prediction: {{ prediction }}
        </div>
    {% endif %}
</div>

</body>
</html>
