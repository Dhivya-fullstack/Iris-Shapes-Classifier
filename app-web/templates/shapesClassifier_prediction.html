<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shapes Prediction Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 15px;
        }

        .prediction {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff7e5f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Shapes Prediction Result</h1>

    <p><strong>Uploaded Image</strong></p>
    <img src="{{ url_for('static', filename='images/' + file_name) }}" alt="Uploaded Image">

    <div class="prediction">
        Prediction: {{ prediction }}
    </div>

    <a href="/" class="back-btn">⬅ Back</a>
</div>

</body>
</html>
